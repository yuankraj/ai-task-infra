version: '3.9'

# ============================================================
# AI Task Platform — Docker Compose (Local Development)
# ============================================================

networks:
  app-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:

services:

  # ── MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:7.0-jammy
    container_name: atp-mongodb
    restart: unless-stopped
    networks: [app-net]
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-task-platform
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: atp-redis
    restart: unless-stopped
    networks: [app-net]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: atp-backend
    restart: unless-stopped
    networks: [app-net]
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai-task-platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod}
      JWT_EXPIRES_IN: 15m
      BCRYPT_SALT_ROUNDS: 10
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Python Worker ─────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: production
    container_name: atp-worker
    restart: unless-stopped
    networks: [app-net]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ai-task-platform
      MONGODB_DB: ai-task-platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_QUEUE_NAME: task-processing
      WORKER_VERSION: 1.0.0
      POLL_INTERVAL_SECONDS: 1
      LOG_LEVEL: INFO
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: atp-frontend
    restart: unless-stopped
    networks: [app-net]
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
