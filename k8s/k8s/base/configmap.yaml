apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
  labels:
    app.kubernetes.io/name: ai-task-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongodb-service:27017/ai-task-platform"
  MONGODB_DB: "ai-task-platform"
  FRONTEND_URL: "http://frontend-service"
  JWT_EXPIRES_IN: "15m"
  BCRYPT_SALT_ROUNDS: "12"
  LOG_LEVEL: "info"
  BULL_QUEUE_NAME: "task-processing"
  WORKER_VERSION: "1.0.0"
  POLL_INTERVAL_SECONDS: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-task-platform
  labels:
    app.kubernetes.io/name: ai-task-platform
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET_IN_PRODUCTION"
  JWT_REFRESH_SECRET: "REPLACE_WITH_STRONG_REFRESH_SECRET"
  REDIS_PASSWORD: ""
