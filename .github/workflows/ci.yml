name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  INFRA_REPO: "yuankraj/ai-task-infra"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run lint --if-present

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint --if-present

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Generate Short SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/atp-backend:${{ env.SHA_SHORT }},${{ env.DOCKER_USERNAME }}/atp-backend:latest
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/atp-backend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/atp-backend:buildcache,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/atp-worker:${{ env.SHA_SHORT }},${{ env.DOCKER_USERNAME }}/atp-worker:latest
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/atp-worker:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/atp-worker:buildcache,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/atp-frontend:${{ env.SHA_SHORT }},${{ env.DOCKER_USERNAME }}/atp-frontend:latest
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/atp-frontend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/atp-frontend:buildcache,mode=max

  update-infra-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Generate Short SHA
        run: echo "SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Update Image Tags in Kustomize Base
        working-directory: infra/k8s/base
        run: |
          sed -i "s|image: .*/atp-backend:.*|image: ${{ env.DOCKER_USERNAME }}/atp-backend:${{ env.SHA_SHORT }}|g" backend.yaml
          sed -i "s|image: .*/atp-worker:.*|image: ${{ env.DOCKER_USERNAME }}/atp-worker:${{ env.SHA_SHORT }}|g" worker.yaml
          sed -i "s|image: .*/atp-frontend:.*|image: ${{ env.DOCKER_USERNAME }}/atp-frontend:${{ env.SHA_SHORT }}|g" frontend.yaml

      - name: Commit and Push Changes
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/*.yaml
          git commit -m "Update image tags to ${{ env.SHA_SHORT }}"
          git push
